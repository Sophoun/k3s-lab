apiVersion: v1
kind: ConfigMap
metadata:
  name: api-code
  namespace: sample-app
data:
  main.py: |
    import http.server
    import socketserver
    import json
    import os
    import time

    class ThreadedHTTPServer(socketserver.ThreadingMixIn, http.server.HTTPServer):
        """Handle requests in a separate thread."""
        daemon_threads = True

    class MyHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/work":
                # Simulate CPU intensive work
                start = time.time()
                count = 0
                while time.time() - start < 0.1: # Busy wait for 100ms
                    count += 1
                
                self.send_response(200)
                self.send_header("Content-type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"status": "worked", "pod": os.getenv("HOSTNAME")}).encode())
            else:
                self.send_response(200)
                self.send_header("Content-type", "application/json")
                self.end_headers()
                response = {
                    "status": "success",
                    "pod_name": os.getenv("HOSTNAME"),
                    "node_name": os.getenv("NODE_NAME")
                }
                self.wfile.write(json.dumps(response).encode())

    print("Starting MULTI-THREADED server on port 8080...")
    server = ThreadedHTTPServer(("0.0.0.0", 8080), MyHandler)
    server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  namespace: sample-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-api
  template:
    metadata:
      labels:
        app: sample-api
    spec:
      containers:
      - name: python
        image: python:3.9-slim
        command: ["python", "/app/main.py"]
        ports:
        - containerPort: 8080
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: api-code
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api-service
  namespace: sample-app
spec:
  type: LoadBalancer
  selector:
    app: sample-api
  ports:
  - port: 80
    targetPort: 8080
