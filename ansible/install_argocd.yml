---
- name: Install ArgoCD
  hosts: vm-1
  become: true
  tasks:
    - name: Create argocd namespace
      shell: k3s kubectl create namespace argocd
      register: ns_create
      failed_when: ns_create.rc != 0 and 'already exists' not in ns_create.stderr

    - name: Download ArgoCD manifest
      get_url:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        dest: /tmp/argocd-install.yaml

    - name: Apply ArgoCD manifest (Server-side for large CRDs)
      shell: k3s kubectl apply -n argocd -f /tmp/argocd-install.yaml --server-side
      ignore_errors: yes

    - name: Apply ArgoCD manifest (Standard apply for remaining resources)
      shell: k3s kubectl apply -n argocd -f /tmp/argocd-install.yaml
      ignore_errors: yes

    - name: Wait for ArgoCD server to be ready
      shell: k3s kubectl wait --namespace argocd --for=condition=ready pod --selector=app.kubernetes.io/name=argocd-server --timeout=300s

    - name: Patch ArgoCD server to use LoadBalancer
      shell: |
        k3s kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "LoadBalancer"}}'

    - name: Get ArgoCD admin password
      shell: k3s kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password

    - name: Get ArgoCD LoadBalancer IP
      shell: k3s kubectl -n argocd get svc argocd-server -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: argocd_ip
      until: argocd_ip.stdout != ""
      retries: 20
      delay: 10

    - name: Display ArgoCD Access Info
      debug:
        msg: 
          - "ArgoCD URL: https://{{ argocd_ip.stdout }}"
          - "Username: admin"
          - "Password: {{ argocd_password.stdout }}"
