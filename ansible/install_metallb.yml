---
- name: Install and Configure MetalLB on K3s
  hosts: vm-1
  become: true
  tasks:
    - name: Download MetalLB manifest
      get_url:
        url: https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
        dest: /tmp/metallb-native.yaml

    - name: Apply MetalLB manifest
      shell: k3s kubectl apply -f /tmp/metallb-native.yaml

    - name: Wait for MetalLB speaker and controller to be ready
      shell: k3s kubectl wait --namespace metallb-system --for=condition=ready pod --selector=app=metallb --timeout=120s

    - name: Create MetalLB IP Address Pool
      shell: |
        cat <<EOF | k3s kubectl apply -f -
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: first-pool
          namespace: metallb-system
        spec:
          addresses:
          - 192.168.252.100-192.168.252.150
        EOF

    - name: Create MetalLB L2 Advertisement
      shell: |
        cat <<EOF | k3s kubectl apply -f -
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: default-advertisement
          namespace: metallb-system
        spec:
          ipAddressPools:
          - first-pool
        EOF
